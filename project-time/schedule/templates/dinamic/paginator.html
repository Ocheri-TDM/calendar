<div class="pagination" id="pagination">
    {% if page_obj.has_previous %}
        <button class="page-btn" data-page="{{ page_obj.previous_page_number }}">
            <i class="fas fa-chevron-left"></i>
        </button>
    {% endif %}

    {% for num in page_obj.paginator.page_range %}
        <button class="page-btn {% if page_obj.number == num %}active{% endif %}" data-page="{{ num }}">
            {{ num }}
        </button>
    {% endfor %}

    {% if page_obj.has_next %}
        <button class="page-btn" data-page="{{ page_obj.next_page_number }}">
            <i class="fas fa-chevron-right"></i>
        </button>
    {% endif %}
</div>
